<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Promessas</title>
    <script>
        // Simulando uma resposta de uma requisição HTTP
        let resposta = {};
        let promessa = new Promise((resolve, reject) => {
            try {
                // Promise executada com sucesso (não será executado)
                setTimeout(() => {
                    resposta = { 
                        cabecalho: { servidor: 'node.js' },
                        dados: { msg: 'resposta vindo do servidor' }
                    };
                    console.log('Resolve 3s:', new Date().toISOString().substr(11,8));
                    resolve('Sucesso!');
                }, 3000);
            } catch (e) {
                // Erro na execução da promessa
                setTimeout(() => {
                    reject(e);
                }, 3000);
            }
        });
        console.log('Definição promessa:', new Date().toISOString().substr(11,8), promessa);
        
        // Bloco 5s
        setTimeout(() => {
            console.log('Bloco 5s:', new Date().toISOString().substr(11,8), promessa);
            console.log(resposta);
        }, 5000);
        console.log('Final função:', new Date().toISOString().substr(11,8), promessa);
    </script>
</head>
<body>
</body>
</html>
